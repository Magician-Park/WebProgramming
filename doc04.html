<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style type="text/css">
            ol {list-style-position: inside;}/* 대문자 */
            ol {list-style-position: outside;} /* 들여쓰기 */
            ol li {list-style-type: upper-alpha;}  /* 대문자 */
            ol li {list-style-type: lower-alpha;}  /* 소문자 */
            ul li {list-style-type: square;} /* 사각형 */
            li.kor{list-style-type: circle;} /* 원 */
            li.usa{list-style-image: url(.gif);} /* PNG도 상관없음, 용량 땜에 GIF 선호 */
            #book {width: 50%; min-width: 600px; border-spacing: 8px;}
            p {background-color: aqua;}
            p:hover {background-color: yellow; transition: background-color 5s;}
            ul {background-color: brown;}
            li {background-color: blue;}
            td {background-color: greenyellow;}
        </style>
    </head>
    <body>
        <p>순서가 없는 목록</p>
        <ul>
            <li class="kor">첫번쨰</li>
            <li class="usa">두번쨰</li>
            <li class="">세번쨰</li>
        </ul>
        <p>순서가 있는 목록</p>
        <ol>
            <li>첫번쨰</li>
            <li>두번쨰</li>
            <li>세번쨰</li>
        </ol>
        <table border="1" id="book">
            <tfoot>
                <tr>
                    <th>합계</th>
                    <td colspan="3">2권</td>
                </tr>
            </tfoot>
            <thead>
                <tr>
                    <th>과목</th>
                    <th>책제목</th>
                    <th>저자</th>
                    <th>출판사</th>
                </tr>
            </thead>
                <tr>
                    <td rowspan="2">웹프로그래밍</td>
                    <td>HTML5</td>
                    <td>임순범</td>
                    <td>생능</td>
                </tr>
                <tr>
                    <td>소셜미디어</td>
                    <td>최윤찬</td>
                    <td>생능</td>
                </tr>
        </table>
    </body>
</html>
